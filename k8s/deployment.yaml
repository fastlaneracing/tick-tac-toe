apiVersion: apps/v1
kind: Deployment
metadata:
  name: swamp-puppy-park
  namespace: swamp-puppy-park
  labels:
    app: swamp-puppy-park
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swamp-puppy-park
  template:
    metadata:
      labels:
        app: swamp-puppy-park
    spec:
      containers:
        - name: web
          image: acrmainaksshared.azurecr.io/swamp-puppy-park:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
